services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: development
      DATABASE_URL: sqlite:////app/data/math_ai_tutor.sqlite
      LLM_ENABLED: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
  frontend:
    image: node:26-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
